# ani.stream Android APK (PLAN.md Step 8; ported from the music app's android.yml).
# On every push to main that touches the app (web code, the Android project or this file):
# build the web app → copy it into the Capacitor project → signed assembleRelease → GitHub Release
# "android-<run number>" with ani-stream.apk attached. The app finds new releases itself
# (shared/infrastructure/apk-update.ts) — the unauthenticated GitHub API only sees releases of a
# public repo. Pull requests to main build the APK without publishing.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   ANI_KEYSTORE_BASE64    base64 of secrets/ani-release.jks (README "Android app")
#   ANI_KEYSTORE_PASSWORD  storePassword from secrets/android-signing.properties (also the key password)
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'scripts/**'
      - 'android/**'
      - 'angular.json'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'apk' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$PUBLISH" = "true" ]; then echo "::error::Secret ANI_KEYSTORE_BASE64 is missing"; exit 1; fi
            echo "::warning::No release key (pull request from a fork?): building unsigned"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ani-release.jks"
          echo "ANI_KEYSTORE_FILE=$RUNNER_TEMP/ani-release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:
          ANI_KEYSTORE_PASSWORD: ${{ secrets.ANI_KEYSTORE_PASSWORD }}
          ANI_KEY_ALIAS: anistream
          ANI_KEY_PASSWORD: ${{ secrets.ANI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
          if [ "$PUBLISH" = "true" ]; then
            test -f app/build/outputs/apk/release/app-release.apk || { echo "::error::APK wasn't signed (check the keystore secrets)"; exit 1; }
          fi

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ani-stream.apk"
          gh release create "android-${{ github.run_number }}" "$RUNNER_TEMP/ani-stream.apk" \
            --title "1.0.${{ github.run_number }}" \
            --notes "Android build from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --target "$GITHUB_SHA"

      - name: Keep the APK of a pull request
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ani-stream-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
