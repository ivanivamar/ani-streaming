<button type="button" class="card" (click)="opened.emit(card())">
  <div class="card__tile" [style.background]="card().color">
    <div class="card__tile-overlay"></div>
    <div class="card__eps">{{ card().episodesLabel }}</div>
    @if (card().hasProgress) {
      <div class="card__progress-track">
        <div class="card__progress-fill" [style.width.%]="card().progressPercent"></div>
      </div>
    }
  </div>
  <div>
    <div class="card__title">{{ card().title }}</div>
    <div class="card__meta">{{ card().meta }}</div>
  </div>
</button>
