<header class="topbar">
  <button type="button" class="wordmark" (click)="goHome()">
    ani<span class="wordmark__dot">.</span><span class="wordmark__rest">stream</span>
  </button>

  <div class="topbar__center">
    @if (searchActive()) {
      <div class="search search--active">
        <i class="material-symbols-outlined search__icon">search</i>
        <input
          #searchInput
          class="search__input"
          type="text"
          placeholder="Search anime…"
          autofocus
          [value]="query()"
          (input)="onQueryInput($event)"
        />
        @if (query()) {
          <button type="button" class="search__clear" aria-label="Clear search" (click)="clearQuery()">×</button>
        }
      </div>
    } @else {
      <button type="button" class="search" (click)="goSearch()">
        <i class="material-symbols-outlined search__icon">search</i>
        <span class="search__placeholder">Search anime…</span>
        <span class="search__kbd">/</span>
      </button>
    }
  </div>

  <div class="profile">
    <button
      type="button"
      class="avatar"
      (click)="toggleProfile()"
      [attr.aria-expanded]="profileOpen()"
      aria-label="Account menu"
    >
      {{ initials() }}
    </button>

    @if (profileOpen()) {
      <div class="popover">
        <div class="popover__header">
          <div class="avatar avatar--lg">{{ initials() }}</div>
          <div class="popover__identity">
            <div class="popover__name">{{ user()?.displayName }}</div>
            <div class="popover__email">{{ user()?.email }}</div>
          </div>
        </div>
        <div class="popover__divider"></div>
        <button type="button" class="logout" (click)="logout()">Log out</button>
      </div>
    }
  </div>
</header>
