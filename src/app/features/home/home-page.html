<app-shell>
  <div class="home">
    <div class="home__heading">
      <h1 class="home__title">Favourites</h1>
      <span class="home__count">{{ favouriteCount() }} saved</span>
    </div>

    <div class="poster-grid">
      @for (card of favourites(); track card.entryId) {
        <app-poster-card [card]="card" (opened)="openCard($event)" />
      }
    </div>

    @if (recentSearches().length) {
      <div class="recent">
        <h2 class="recent__label">Recently searched</h2>
        <div class="recent__list">
          @for (term of recentSearches(); track term) {
            <button type="button" class="pill" (click)="openRecent(term)">
              <span class="pill__chevron">›</span>{{ term }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</app-shell>
